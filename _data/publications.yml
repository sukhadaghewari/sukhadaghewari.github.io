# ---------------------------------------------------------------
# YOUR WORK: PAPERS, TUTORIALS, POSTERS, ...
# One entry each, newest first. Research on the home page lists them,
# papers under Publications and everything else (tutorials, posters)
# under Tutorials and posters.
#
#   title:     the full title, in quotes
#   authors:   everyone, in paper order, e.g. [Sukhada Ghewari, Adway Mitra]
#              (your own name is made bold)
#   venue:     the full name of the workshop or conference, e.g.
#              "Tackling Climate Change with Machine Learning (TCCML) Workshop"
#   short:     a short name for its tag, e.g. "TCCML Workshop".
#              Leave it out when the venue is already short.
#   host:      only for a workshop: the conference it is part of, e.g. "WACV"
#   year:      the year of the conference
#   type:      Paper if you leave it out. Otherwise Tutorial, Poster, ...
#
# Each paper gets one row of small tags, always in this order:
#   [Host Year]  [Workshop]  [Type]  [Code] ...
#   WACV 2027  GeoCV Workshop  Paper
#   APWG eCrime 2021  Paper
# (For a conference paper with no host, the first tag is the venue and year.)
#
# Optional:
#   url:       where to read it. The type tag (Paper, Tutorial, ...)
#              becomes a link to it.
#   links:     more links, each becomes a tag, e.g.
#                links:
#                  - name: Code
#                    url: "https://..."
#   note:      one short line under the tags, e.g. a related patent.
#              "Accepted" or "Accepted, to appear" becomes a small
#              italic tag instead.
#   bibtex:    your own BibTeX for the BibTeX tag, after "bibtex: |".
#              Without it, one is written from the fields above.
#   summary:   three or four plain sentences, at most four lines on the
#              page. A Summary tag opens it under the paper.
# ---------------------------------------------------------------

- title: "Can Multimodal LLMs Predict Rapid Intensification? A Leakage-Controlled Zero-Shot Benchmark for Tropical Cyclones"
  authors: [Sukhada Ghewari, Harshal Tupsamudre]
  venue: "GeoCV Workshop"
  host: "WACV"
  year: 2027
  note: "Accepted, to appear"
  summary: >-
    A leakage-controlled, zero-shot benchmark asking whether multimodal LLMs
    can predict rapid intensification (a 30+ kt rise in winds within 24 h). Six
    commercial models saw 140 anonymized storms with environmental data, with
    and without infrared imagery. The best reached 0.34 AUPRC (3x no-skill),
    but images didn't clearly help and a trained XGBoost scored 0.44.

- title: "Tropical Cyclone Rapid Intensification (RI) Prediction using Machine Learning"
  authors: [Sukhada Ghewari, Adway Mitra]
  type: Tutorial
  venue: "Tackling Climate Change with Machine Learning Workshop"
  host: "NeurIPS"
  year: 2026
  note: "Accepted, to appear"
  summary: >-
    A hands-on notebook that teaches rapid intensification prediction end to
    end, with IBTrACS storm tracks, ERA5 reanalysis and satellite imagery. Its
    pedagogy builds one idea at a time, from framing RI as a rare-event
    problem, to features a forecaster can read, to checking whether a model
    can be trusted on storms it has never seen.

- title: "Which Information Matters for Rapid Intensification of Tropical Cyclones? A Global-Basin Feature Ablation Study"
  authors: [Sukhada Ghewari, Shardul Deshpande]
  type: Poster
  venue: "Women in Machine Learning (WiML) Workshop"
  short: "WiML Workshop"
  host: "NeurIPS"
  year: 2026
  note: "Accepted"

- title: "When Diversity Meets Hostility: A Study of Domain Squatting Abuse in Online Banking"
  authors: [Neeraj Kumar, Sukhada Ghewari, Harshal Tupsamudre, Manish Shukla, Sachin Lodha]
  venue: "APWG Symposium on Electronic Crime Research (eCrime)"
  short: "APWG eCrime"
  year: 2021
  url: "https://ieeexplore.ieee.org/abstract/document/9738769"
  note: "This work also led to a patent granted in India (Patent No. 560163)."
  summary: >-
    Domain squatting means registering lookalike web addresses to fool people
    into trusting them. We studied how it is used against online banking, and
    built a domain name generation algorithm, a context-free grammar combined
    with unsupervised learning, that predicts lookalike domains so banks can
    register them defensively before attackers do.
