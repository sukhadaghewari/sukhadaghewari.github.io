- title: "Can Multimodal LLMs Predict Rapid Intensification? A Leakage-Controlled Zero-Shot Benchmark for Tropical Cyclones"
  authors: [Sukhada Ghewari, Harshal Tupsamudre]
  venue: "GeoCV Workshop"
  host: "WACV"
  year: 2027
  selected: true
  summary: |
    We wanted to know whether off-the-shelf multimodal LLMs can predict rapid intensification without any training. We gave six commercial models the recent history of 140 storms, along with environmental data and infrared satellite images, and removed names, dates and locations so they couldn't simply remember what happened.

    The best model did two to three times better than chance. The satellite images didn't clearly help, though, and a plain XGBoost model trained on older storms still beat every LLM.

- title: "Tropical Cyclone Rapid Intensification (RI) Prediction using Machine Learning"
  authors: [Sukhada Ghewari, Adway Mitra]
  type: Tutorial
  venue: "Tackling Climate Change with Machine Learning (TCCML) Workshop"
  short: "TCCML Workshop"
  host: "NeurIPS"
  year: 2026
  selected: true
  summary: |
    A hands-on notebook that walks through predicting rapid intensification from start to finish, using real storm tracks, satellite images and reanalysis data. It shows how to treat RI as the rare event it is, build features a forecaster can make sense of, and check whether a model can really be trusted. The hope is to give forecasters more time to prepare before a storm suddenly strengthens.

