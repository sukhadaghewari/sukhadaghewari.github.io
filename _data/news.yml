# ---------------------------------------------------------------
# UPDATES
# Short announcements. The home page shows the newest 4 under Updates,
# and the Updates page (/updates/) shows all of them. Add one when something is worth announcing,
# like a paper accepted, a win or a new role. It doesn't have to be
# complete, since your full record lives in _data/cv.yml.
#
# Each entry has two lines:
#   date: "2026-09"   year and month, in quotes. Use just "2025"
#                     when the month doesn't matter.
#   text: >-          one or two sentences. Links work as usual:
#                     [*Project page*](https://...)
#                     For a paper, tutorial or poster, start with its
#                     full title in quotes, e.g.
#                       “Title” was accepted as a paper at the GeoCV
#                       Workshop at WACV 2027.
#
# Order doesn't matter: entries are sorted by date on the site.
# ---------------------------------------------------------------

