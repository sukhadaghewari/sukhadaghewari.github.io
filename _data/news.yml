# ---------------------------------------------------------------
# NEWS
# Short announcements for the News section on the home page, which
# shows the newest 5. Add one when something is worth announcing,
# like a paper accepted, a win or a new role. It doesn't have to be
# complete, since your full record lives in _data/cv.yml.
#
# Each entry has two lines:
#   date: "2026-09"   year and month, in quotes. Use just "2025"
#                     when the month doesn't matter.
#   text: >-          one or two sentences. Links work as usual:
#                     [Project page](https://...)
#                     For a paper, tutorial or poster, describe it in a
#                     few words instead of the full title (the full title
#                     is on the Research list), e.g.
#                       Paper on zero-shot rapid intensification prediction
#                       with multimodal LLMs accepted at the GeoCV
#                       Workshop, WACV 2027.
#
# Order doesn't matter: entries are sorted by date on the site.
# ---------------------------------------------------------------

