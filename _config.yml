# ---------------------------------------------------------------
# YOUR DETAILS
# Edit these lines, click "Commit changes", and the site updates
# in about a minute. Keep the quotes around links.
# ---------------------------------------------------------------

title: Sukhada Ghewari
tagline: Applied ML researcher and engineer working on real-world problems in climate and health
description: >-
  Machine learning researcher and engineer building AI for people and the
  planet, from extreme-weather early warning to forest monitoring and health.

# Small tags under your name on the home page
topics:
  - Climate & extreme weather
  - Earth observation
  - Health & clinical AI
  - AI for social impact

# Your email address, shown on the home page with a button that copies it.
# Delete this line to leave the address off the site.
email: sukhada.ghewari@gmail.com

# Your Substack. The Writing page invites readers to subscribe there.
# Delete this line to hide the invitation.
substack: "https://substack.com/@sukhada14"

# Links under your name on the home page, in this order.
# To remove one, delete both of its lines.
links:
  - name: Google Scholar
    url: "https://scholar.google.com/citations?hl=en&user=oeQF_3gAAAAJ"
  - name: OpenReview
    url: "https://openreview.net/profile?id=%7ESukhada_Ghewari1"
  - name: GitHub
    url: "https://github.com/sukhadaghewari"
  - name: LinkedIn
    url: "https://www.linkedin.com/in/sukhada-ghewari/"
  - name: Substack
    url: "https://substack.com/@sukhada14"
  - name: Bluesky
    url: "https://bsky.app/profile/sukhada.bsky.social"
  - name: X
    url: "https://x.com/sukhadathinks"

# Your photo. Upload a square picture as assets/img/photo.jpg.
# Put a # at the start of the next line to show your initials instead.
photo: /assets/img/photo.jpg

# Your CV as a PDF, for the "Download CV" button on the home page.
# Upload it as assets/cv.pdf. Delete this line to hide the button.
cv_pdf: /assets/cv.pdf

# Cover photo: shown very faintly behind the top of the home page.
# Upload yours as assets/img/cover.jpg. Put a # at the start of the next
# line to hide it.
cover: /assets/img/cover.jpg
# Which part of the photo to keep when it's cropped: top, center or bottom,
# or a percentage from the top, e.g. "center 40%".
cover_position: "center 58%"

# Smaller WebP copies of the photo and cover, so the page loads fast.
# When you upload a new photo or cover, delete its line here, or the
# old picture keeps showing.
photo_webp: /assets/img/photo.webp
cover_webp: [/assets/img/cover-1000.webp 1000w, /assets/img/cover-2000.webp 2000w]

# Tabs at the top of every page
nav:
  - name: Home
    url: /
  - name: Writing
    url: /blog/

# The two kinds of post, shown as tabs above the list on the Writing page.
# Technical posts usually live here; Thoughts usually live on Substack.
# Each post picks one in its top section, e.g. `kind: thoughts`.
# You can rename a tab by changing its name; keep the id as it is.
post_kinds:
  - id: technical
    name: Technical
  - id: thoughts
    name: Thoughts


# ---------------------------------------------------------------
# SITE SETTINGS
# You shouldn't need to change anything below this line.
# ---------------------------------------------------------------

url: "https://sukhadaghewari.github.io"   # your site's address, for share previews, the sitemap and RSS
timezone: Asia/Kolkata
permalink: /blog/:year/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "↩︎"

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Every post uses the post layout, and every page the default one,
# so new files only need a title.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
