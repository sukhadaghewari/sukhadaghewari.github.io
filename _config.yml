# ---------------------------------------------------------------
# YOUR DETAILS
# Edit these lines, click "Commit changes", and the site updates
# in about a minute. Keep the quotes around links.
# ---------------------------------------------------------------

title: Sukhada Ghewari
tagline: Applied machine learning for social and environmental good
description: >-
  Machine learning researcher and engineer building AI for
  people and the planet: extreme-weather early warning, forest monitoring,
  health and more.
location: India

# Small tags under your name on the home page
topics:
  - Climate & extreme weather
  - Earth observation
  - Health & clinical AI
  - Responsible AI

# Your email address, shown on the home page with a button that copies it.
# Delete this line to leave the address off the site.
email: sukhada.ghewari@gmail.com

# Links under your name on the home page, in this order.
# To remove one, delete both of its lines.
links:
  - name: GitHub
    url: "https://github.com/sukhadaghewari"
  - name: Google Scholar
    url: "https://scholar.google.com/citations?hl=en&user=oeQF_3gAAAAJ"
  - name: LinkedIn
    url: "https://www.linkedin.com/in/sukhada-ghewari/"
  - name: Bluesky
    url: "https://bsky.app/profile/sukhada.bsky.social"
  - name: X
    url: "https://x.com/sukhadathinks"
  

# Your photo. Upload a square picture as assets/img/photo.jpg.
# Put a # at the start of the next line to show your initials instead.
photo: /assets/img/photo.jpg

# Your CV as a PDF, for the "Download CV" button on the home page.
# Upload it as assets/cv.pdf. Delete this line to hide the button.
cv_pdf: /assets/cv.pdf

# Cover photo: the wide strip at the top of the home page, with your
# photo overlapping it.
# Upload yours as assets/img/cover.jpg, then change ".svg" to ".jpg"
# on the next line. Put a # at the start of the line to hide the cover.
cover: /assets/img/cover.jpg
# Which part of the photo to keep when it's cropped: top, center or bottom,
# or a percentage from the top ("center 46%" keeps the same top edge as
# center did before the strip was made 10% shorter).
cover_position: center 46%

# Tabs at the top of every page
nav:
  - name: Home
    url: /
  - name: Blog
    url: /blog/

# The filters above your full timeline on the home page, in this order.
# Every entry in _data/timeline.yml uses one of these as its kind.
timeline_kinds:
  - Research
  - Projects
  - Education
  - Learning
  - Role
  - Service

# The two kinds of blog post, shown as tabs above the Blog list.
# Each post picks one in its top section, e.g. `kind: thoughts`.
# You can rename a tab by changing its name; keep the id as it is.
post_kinds:
  - id: technical
    name: Technical
  - id: thoughts
    name: Thoughts


# ---------------------------------------------------------------
# SITE SETTINGS
# You shouldn't need to change anything below this line.
# ---------------------------------------------------------------

timezone: Asia/Kolkata
permalink: /blog/:year/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "↩︎"

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Every post uses the post layout, and every page the default one,
# so new files only need a title.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
