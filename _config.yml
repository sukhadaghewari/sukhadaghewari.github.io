    url: /blog/


# ---------------------------------------------------------------
# SITE SETTINGS
# You shouldn't need to change anything below this line.
# ---------------------------------------------------------------

timezone: Asia/Kolkata
permalink: /blog/:year/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "↩︎"

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Every post uses the post layout, and every page the default one,
# so new files only need a title.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
