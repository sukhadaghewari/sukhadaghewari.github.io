# Checks every outside link on the site once a week and after each change.
# If one breaks, this run fails and GitHub emails you the list.
name: Check links
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress --scheme https --scheme http
            --max-retries 3 --accept 200..=299,403,429,999
            --exclude fonts.googleapis.com --exclude fonts.gstatic.com
            --exclude-path _site --exclude-path vendor
            './**/*.html' './**/*.md' _config.yml './_data/*.yml'
